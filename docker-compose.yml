# ==============================================================================
# Territory Runner: Root Local Development Compose Stack
# Purpose: Seamless one-command local developer stack (docker compose up)
# ==============================================================================

services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: territory_postgis_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runnerpass
      POSTGRES_DB: territory_runner
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runner -d territory_runner"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: territory_backend_dev
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PORT: "8080"
      ENV: "development"
      AUTH_MODE: "dev"
      RUN_MIGRATIONS: "true"
      DATABASE_URL: "postgres://runner:runnerpass@postgis:5432/territory_runner?sslmode=disable"
      GEMINI_API_KEY: ""
    ports:
      - "8080:8080"

volumes:
  pgdata_dev:
