name: Release Verification

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/release_check.yml'

jobs:
  release_readiness:
    name: Verify Release & Store Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Validate pubspec.yaml Semver Format
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          echo "Detected version: $VERSION"
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "ERROR: Version does not match Semver 'X.Y.Z+build' format: $VERSION"
            exit 1
          fi

      - name: Validate Android R8 & ProGuard Configuration
        run: |
          BUILD_GRADLE="android/app/build.gradle.kts"
          if ! grep -q "isMinifyEnabled = true" "$BUILD_GRADLE"; then
            echo "ERROR: isMinifyEnabled is not enabled in $BUILD_GRADLE"
            exit 1
          fi
          if ! grep -q "isShrinkResources = true" "$BUILD_GRADLE"; then
            echo "ERROR: isShrinkResources is not enabled in $BUILD_GRADLE"
            exit 1
          fi
          if [ ! -f "android/app/proguard-rules.pro" ]; then
            echo "ERROR: android/app/proguard-rules.pro is missing"
            exit 1
          fi
          echo "Release R8 and ProGuard configuration verified."

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Unit and Golden Tests
        run: flutter test

  build_release_apk:
    name: Build & Inspect Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [release_readiness]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Provision CI Google Services JSON
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "Generating dummy google-services.json from example template for CI build..."
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Inspect Built APK Metadata
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at $APK"
            exit 1
          fi
          echo "=== Locating AAPT ==="
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -n 1)
          if [ -n "$AAPT" ]; then
            echo "=== APK Badging (Package, Version, SDK) ==="
            $AAPT dump badging "$APK" | grep -E "package: name=|sdkVersion:|targetSdkVersion:"
            echo "=== APK Declared Permissions ==="
            $AAPT dump badging "$APK" | grep "uses-permission:"
          else
            echo "WARNING: aapt binary not located in $ANDROID_HOME/build-tools"
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
