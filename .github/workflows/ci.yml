name: CI

on:
  push:
    branches:
      - main
      - industry-level
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - industry-level

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter_quality:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Display Flutter Environment
        run: flutter --version

      - name: Verify Dart Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter Unit, Widget & Golden Tests
        run: flutter test --coverage --timeout 120s

      - name: Upload Flutter Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  go_backend:
    name: Go Backend Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum

      - name: Display Go Environment
        run: go version

      - name: Verify Go Formatting (gofmt)
        working-directory: backend
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "ERROR: The following Go files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Static Code Analysis (go vet)
        working-directory: backend
        run: go vet ./...

      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Go Unit Tests & Race Detection
        working-directory: backend
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Go Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  postgres_integration:
    name: PostGIS Service Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [go_backend]

    services:
      postgis:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runnerpass
          POSTGRES_DB: territory_runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner -d territory_runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum

      - name: Run PostGIS Integration Tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: "postgres://runner:runnerpass@localhost:5432/territory_runner?sslmode=disable"
        run: go test -v -race -tags=integration ./internal/store/...

  docker_build:
    name: Backend Docker Container Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [go_backend, postgres_integration]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go Backend Container
        run: docker build -t territory-runner-backend:latest ./backend
